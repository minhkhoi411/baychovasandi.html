
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPT Shop - Danh sách sản phẩm</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f5f7;
    color: #333;
}

header {
    background: #cb1c22;
    color: white;
    padding: 20px 6%;
}

.headercontent {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.logo span {
    color: #ffe000;
}

.search {
    padding: 12px 18px;
    border: none;
    border-radius: 25px;
    width: 280px;
    outline: none;
}

.banner {
    background: linear-gradient(120deg, #cb1c22, #ed5258);
    color: white;
    text-align: center;
    padding: 45px 15px;
}

.banner h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.banner p {
    font-size: 16px;
}

.container {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 20px;
}

.section-title {
    font-size: 25px;
    margin-bottom: 25px;
    border-left: 5px solid #cb1c22;
    padding-left: 12px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.product-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: 0.3s;
    display: flex;
    flex-direction: column;
}

.product-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 22px rgba(0,0,0,0.13);
}

.product-img {
    width: 100%;
    height: 230px;
    object-fit: contain;
    padding: 15px;
    background: white;
}

.product-info {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.product-name {
    font-size: 18px;
    min-height: 45px;
    margin-bottom: 12px;
    line-height: 1.4;
}

.price-box {
    margin-bottom: 15px;
}

.sale-price {
    color: #cb1c22;
    font-size: 23px;
    font-weight: bold;
}

.original-price {
    color: #999;
    text-decoration: line-through;
    font-size: 14px;
    margin-left: 8px;
}

.discount {
    display: inline-block;
    background: #ffeaea;
    color: #cb1c22;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 13px;
    margin-bottom: 12px;
    width: fit-content;
}

.offer {
    background: #fff7f0;
    border: 1px dashed #f0a05b;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
}

.offer h3 {
    color: #cb1c22;
    font-size: 15px;
    margin-bottom: 9px;
}

.offer ul {
    padding-left: 18px;
}

.offer li {
    font-size: 13px;
    margin-bottom: 7px;
    line-height: 1.5;
}

details {
    border-top: 1px solid #eee;
    padding-top: 12px;
    margin-top: auto;
}

summary {
    color: #cb1c22;
    cursor: pointer;
    font-weight: bold;
    padding: 8px 0;
}

.description {
    font-size: 13px;
    line-height: 1.7;
    color: #555;
    padding: 10px 0;
    white-space: pre-line;
}

.buy-btn {
    display: block;
    width: 100%;
    border: none;
    background: #cb1c22;
    color: white;
    padding: 13px;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

.buy-btn:hover {
    background: #a9151b;
}

.empty {
    text-align: center;
    padding: 40px;
    grid-column: 1 / -1;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 50px;
    font-size: 14px;
}

@media(max-width: 600px) {
    .header-content {
        justify-content: center;
    }

    .search {
        width: 100%;
    }

    .banner h1 {
        font-size: 25px;
    }

    .container {
        padding: 0 12px;
    }
}


/* Trang chi tiết sản phẩm */
.detail-container{max-width:1200px;margin:32px auto;padding:0 20px}
.back-btn{border:0;background:#555;color:#fff;padding:11px 18px;border-radius:6px;cursor:pointer;font-weight:bold;margin-bottom:22px}
.back-btn:hover{background:#333}
.detail-card{background:#fff;border-radius:12px;padding:28px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
.detail-top{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:34px;align-items:start}
.detail-image{width:100%;height:390px;object-fit:contain;background:#fff}
.detail-title{font-size:28px;line-height:1.35;margin:8px 0 20px;color:#222}
.detail-price{font-size:30px;font-weight:bold;color:#cb1c22;margin:12px 0}
.detail-old-price{color:#999;text-decoration:line-through;font-size:17px;margin-left:10px}
.detail-section{margin-top:30px;padding-top:20px;border-top:1px solid #eee}
.detail-section h2{font-size:21px;color:#cb1c22;margin-bottom:14px}
.detail-description{white-space:pre-line;line-height:1.8;color:#444}
.detail-specs{white-space:pre-wrap;line-height:1.65;color:#333;overflow-wrap:anywhere;background:#fafafa;padding:18px;border-radius:8px}
.detail-offers{padding-left:22px;line-height:1.8}
@media(max-width:700px){.detail-container{padding:0 12px}.detail-card{padding:16px}.detail-top{grid-template-columns:1fr;gap:12px}.detail-image{height:280px}.detail-title{font-size:23px}}

</style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="logo">FPT <span>SHOP</span></div>
        <input
            type="text"
            class="search"
            id="search"
            placeholder="Tìm kiếm sản phẩm..."
        >
    </div>
</header>

<section class="banner">
    <h1>THẾ GIỚI CÔNG NGHỆ</h1>
    <p>Khám phá sản phẩm công nghệ và gia dụng với nhiều ưu đãi hấp dẫn</p>
</section>

<main class="container">

    <h2 class="section-title">Danh sách sản phẩm nổi bật</h2>

    <div class="product-grid" id="product-grid"></div>

</main>

<footer>
    <p>© 2026 FPT SHOP - Website giới thiệu sản phẩm</p>
    <p>Thông tin sản phẩm được cung cấp cho mục đích tham khảo.</p>
</footer>


</div>

<script>

// DỮ LIỆU SẢN PHẨM

let products = []

async function loadProducts() {
    try {
        const response = await fetch("https://baychovasandi-html.onrender.com/api/products");
        const data = await response.json();

        if (!response.ok || data.success === false || data.Success === false) {
            throw new Error(data.message || "Không thể lấy dữ liệu sản phẩm");
        }

        const records = data.products || data.Products || [];

        products = records.map(item => {
            const fields = item.fields || item;

            // Tìm trường dữ liệu theo tên cột Airtable
            const getField = (...names) => {
                for (const name of names) {
                    if (fields[name] !== undefined) {
                        return fields[name];
                    }
                }

                // Tìm gần đúng nếu tên trường có khác biệt
                const key = Object.keys(fields).find(key =>
                    names.some(name =>
                        key.toLowerCase().includes(name.toLowerCase())
                    )
                );

                return key ? fields[key] : "";
            };

            const parsePrice = value => {
                if (typeof value === "number") return value;

                return Number(
                    String(value || "")
                        .replace(/[^\d]/g, "")
                ) || 0;
            };

            return {
                id: item.id,

                name: getField("Name", "name"),

                price: parsePrice(
                    getField("Price", "price")
                ),

                salePrice: parsePrice(
                    getField(
                        "sale price",
                        "sale of price",
                        "salePrice"
                    )
                ),

                image: getField(
                    "Illustrations images",
                    "image",
                    "hình ảnh minh họa"
                ),

                offers: String(
                    getField(
                        "Attractive offers",
                        "offers",
                        "ưu đãi hấp dẫn"
                    )
                ).split("\n").filter(Boolean),

                description: getField(
    "Description Inside the Small Page",
    "description"
),

specifications: getField(
    "Specifications",
    "Thông số kỹ thuật",
    "specifications"
),

status: getField("Status", "status")
            };
        });

        console.log("Đã tải sản phẩm từ Airtable:", products);

        // Hiển thị danh sách sản phẩm
        const selectedProduct =
            new URLSearchParams(window.location.search).get("product");

        if (
            selectedProduct !== null &&
            /^\d+$/.test(selectedProduct)
        ) {
            renderProductDetail(Number(selectedProduct));
        } else {
            renderProducts(products);
        }

    } catch (error) {
        console.error("Lỗi tải sản phẩm:", error);

        const container = document.querySelector("#product-grid");

        if (container) {
            container.innerHTML =
                "<p>Không thể tải sản phẩm. Vui lòng thử lại.</p>";
        }
    }
}

    
        

// ĐỊNH DẠNG TIỀN

function formatPrice(price) {
    return price.toLocaleString("vi-VN") + "đ";
}

// HIỂN THỊ SẢN PHẨM

function renderProducts(list) {

    const grid = document.getElementById("product-grid");

    if (list.length === 0) {
        grid.innerHTML = '<div class="empty">Không tìm thấy sản phẩm phù hợp!</div>';
        return;
    }

    grid.innerHTML = list.map((item, index) => {

        const discount = Math.round(
            (item.price - item.salePrice) / item.price * 100
        );

        return `
        <div class="product-card">

            <img
                class="product-img"
                src="${item.image}"
                alt="${item.name}"
                onerror="this.onerror=null; this.src='https://placehold.co/400x300/png?text=Anh+san+pham'; this.alt='Không tải được ảnh sản phẩm'"
            >

            <div class="product-info">

                <h2 class="product-name">
                    ${item.name}
                </h2>

                <div class="price-box">
                    <div class="sale-price">
                        ${formatPrice(item.salePrice)}
                    </div>

                    <span class="original-price">
                        ${formatPrice(item.price)}
                    </span>
                </div>

                <div class="discount">
                    Giảm ${discount}%
                </div>

                <div class="offer">
                    <h3>🎁 Ưu đãi đặc biệt</h3>

                    <ul>
                        ${item.offers.map(offer =>
                            `<li>${offer}</li>`
                        ).join("")}
                    </ul>
                </div>

                <details>
                    <summary>📋 Xem mô tả chi tiết</summary>

                    <div class="description">${item.description}</div>
                </details>

                <button class="buy-btn"
                    onclick="openProductPage(${products.indexOf(item)})">
                    XEM SẢN PHẨM
                </button>

            </div>
        </div>
        `;
    }).join("");
}

// TÌM KIẾM SẢN PHẨM

document.getElementById("search").addEventListener("input", function() {

    const keyword = this.value.toLowerCase().trim();

    const filtered = products.filter(item =>
        item.name.toLowerCase().includes(keyword)
    );

    renderProducts(filtered);
});

// MỞ TRANG CON CHI TIẾT SẢN PHẨM
function openProductPage(index) {
    window.location.href = window.location.pathname + "?product=" + encodeURIComponent(index);
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
}

function renderProductDetail(index) {
    const item = products[index];
    if (!item) {
        document.querySelector("main").innerHTML =
            '<div class="detail-container"><button class="back-btn" onclick="goBackToList()">← Quay lại danh sách</button><h2>Không tìm thấy sản phẩm.</h2></div>';
        return;
    }

    document.querySelector("main").className = "detail-container";
    document.querySelector("main").innerHTML = `
        <button class="back-btn" onclick="goBackToList()">← Quay lại danh sách sản phẩm</button>
        <article class="detail-card">
            <div class="detail-top">
                <img class="detail-image" src="${escapeHTML(item.image)}"
                     alt="${escapeHTML(item.name)}"
                     onerror="this.onerror=null;this.src='https://placehold.co/600x500/png?text=Anh+san+pham';this.alt='Không tải được ảnh sản phẩm'">
                <div>
                    <h1 class="detail-title">${escapeHTML(item.name)}</h1>
                    <div>Giá niêm yết: <span class="detail-old-price">${formatPrice(item.price)}</span></div>
                    <div class="detail-price">${formatPrice(item.salePrice)}</div>
                    <div class="discount">Giảm ${Math.round((item.price-item.salePrice)/item.price*100)}%</div>
                </div>
            </div>
            <section class="detail-section">
                <h2>🎁 Ưu đãi đặc biệt</h2>
                <ul class="detail-offers">${(item.offers || []).map(x => `<li>${escapeHTML(x)}</li>`).join("")}</ul>
            </section>
            <section class="detail-section">
                <h2>📋 Mô tả chi tiết</h2>
                <div class="detail-description">${escapeHTML(item.description || "Chưa có mô tả")}</div>
            </section>
            <section class="detail-section">
                <h2>⚙️ Thông số kỹ thuật đầy đủ</h2>
                <div class="detail-specs">${escapeHTML(item.specifications || "Chưa có thông số kỹ thuật")}</div>
            </section>
        </article>
    `;
    document.title = item.name + " - Chi tiết sản phẩm";
}

function goBackToList() {
    window.location.href = window.location.pathname;
}

// KHỞI CHẠY


// KHỞI CHẠY
loadProducts();
