<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPT Smart Devices - Danh Sách Sản Phẩm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f8; padding: 20px; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { text-align: center; color: #cb1c22; margin-bottom: 25px; text-transform: uppercase; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .product-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
    .product-img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 12px; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; width: fit-content; margin-bottom: 8px; }
    .status-con-hang { background-color: #e6f4ea; color: #137333; }
    .status-sap-ve { background-color: #fef7e0; color: #b06000; }
    .product-name { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #111; }
    .price-box { margin-bottom: 10px; }
    .sale-price { font-size: 18px; font-weight: bold; color: #cb1c22; margin-right: 8px; }
    .original-price { font-size: 13px; text-decoration: line-through; color: #888; }
    .offer { font-size: 12px; background: #fff0f0; color: #cb1c22; padding: 8px; border-radius: 4px; border: 1px dashed #cb1c22; margin-top: 10px; }
    .loading, .error { text-align: center; grid-column: 1 / -1; padding: 40px; font-size: 16px; color: #666; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Danh Sách Sản Phẩm</h1>
    <div id="product-grid" class="product-grid">
      <div class="loading">Đang tải dữ liệu từ Airtable...</div>
    </div>
  </div>

  <script>
    async function fetchProducts() {
      const grid = document.getElementById('product-grid');

      // 1. Để trắng token hoàn toàn theo đúng quy tắc bảo mật
      let AIRTABLE_TOKEN = ''; 

      // 2. Hiện hộp thoại hỏi nhập Token khi mở trang web
      if (!AIRTABLE_TOKEN) {
        AIRTABLE_TOKEN = prompt("Vui lòng nhập Airtable Personal Access Token (pat...):");
      }

      if (!AIRTABLE_TOKEN) {
        grid.innerHTML = '<div class="error">Bạn chưa nhập Token Airtable! Vui lòng bấm Ctrl + F5 để nhập lại.</div>';
        return;
      }

      const BASE_ID = 'appcdWDPJL78X0ouh'; 
const TABLE_NAME = encodeURIComponent('Table 1');
      try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}`, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`
          }
        });

        const data = await response.json();

        if (!response.ok || !data.records) {
          grid.innerHTML = '<div class="error">Lỗi tải dữ liệu. Hãy kiểm tra lại Token Airtable của bạn!</div>';
          return;
        }

        const products = data.records.map(record => ({
          id: record.id,
          ...record.fields
        }));

        grid.innerHTML = products.map(item => {
          const imgUrl = item['Attachment Summary']?.value || 'https://via.placeholder.com/200?text=No+Image';
          const isConHang = item.Status === 'Còn hàng';
          const statusClass = isConHang ? 'status-con-hang' : 'status-sap-ve';

          return `
            <div class="product-card">
              <div>
                <img class="product-img" src="${imgUrl}" alt="${item.Product || ''}" />
                <div class="status-badge ${statusClass}">${item.Status || 'N/A'}</div>
                <h2 class="product-name">${item.Product || 'Không có tên'}</h2>
                
                <div class="price-box">
                  <span class="sale-price">${item.Sale_price || item.Price || ''}</span>
                  ${item.Sale_price && item.Price && item.Sale_price !== item.Price ? `<span class="original-price">${item.Price}</span>` : ''}
                </div>
              </div>
              ${item['Ưu đãi'] ? `<div class="offer">🎁 ${item['Ưu đãi']}</div>` : ''}
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Lỗi:", err);
        grid.innerHTML = '<div class="error">Lỗi kết nối tới Airtable!</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchProducts);
  </script>

</body>
</html>
