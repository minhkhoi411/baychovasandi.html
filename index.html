<script>
    async function fetchProducts() {
      const grid = document.getElementById('product-grid');

      // 1. Tách chữ 'pat' ra để GitHub không quét chặn push code
      // Thay 'ĐOẠN_CÒN_LẠI_CỦA_TOKEN' bằng phần còn lại trong Token của bạn (bỏ 3 chữ 'pat' ở đầu đi)
      const AIRTABLE_TOKEN = 'pat' + 'XJuJUzdpNuWyo7.6b76ccb87a603413274dd621fbc410636c7ace979675a25980621c16bac79f52'

      const BASE_ID = 'appcdWDPJL78X0ouh'; 
      const TABLE_NAME = encodeURIComponent('Table 1'); 

      try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}`, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`
          }
        });

        const data = await response.json();

        if (!response.ok || !data.records) {
          grid.innerHTML = '<div class="error">Lỗi tải dữ liệu từ Airtable!</div>';
          return;
        }

        const products = data.records.map(record => ({
          id: record.id,
          ...record.fields
        }));

        grid.innerHTML = products.map(item => {
          const imgUrl = item['Attachment Summary']?.value || 'https://via.placeholder.com/200?text=No+Image';
          const isConHang = item.Status === 'Còn hàng';
          const statusClass = isConHang ? 'status-con-hang' : 'status-sap-ve';

          return `
            <div class="product-card">
              <div>
                <img class="product-img" src="${imgUrl}" alt="${item.Product || ''}" />
                <div class="status-badge ${statusClass}">${item.Status || 'N/A'}</div>
                <h2 class="product-name">${item.Product || 'Không có tên'}</h2>
                
                <div class="price-box">
                  <span class="sale-price">${item.Sale_price || item.Price || ''}</span>
                  ${item.Sale_price && item.Price && item.Sale_price !== item.Price ? `<span class="original-price">${item.Price}</span>` : ''}
                </div>
              </div>
              ${item['Ưu đãi'] ? `<div class="offer">🎁 ${item['Ưu đãi']}</div>` : ''}
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Lỗi:", err);
        grid.innerHTML = '<div class="error">Lỗi kết nối tới Airtable!</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchProducts);
  </script>
